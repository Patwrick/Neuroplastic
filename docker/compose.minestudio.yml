services:
  minestudio:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.minestudio
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ..:/workspace
      - minestudio_tmp:/tmp/MineStudio
      - hf_cache:/root/.cache/huggingface

volumes:
  minestudio_tmp:
  hf_cache:
